<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tharuka Scientific Calculator</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#0f172a,#020617);
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

.calculator {
  width: 340px;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

.display {
  width: 100%;
  height: 70px;
  background: #000;
  color: #facc15;
  font-size: 28px;
  text-align: right;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  overflow-x: auto;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 10px;
}

button {
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #facc15;
  color: black;
  transform: scale(1.05);
}

.equal {
  background: #facc15;
  color: black;
  grid-column: span 2;
}

.operator {
  color: #facc15;
}
</style>
</head>

<body>

<div class="calculator">
  <div id="display" class="display">0</div>

  <div class="buttons">
    <button onclick="clearDisplay()">C</button>
    <button onclick="append('(')">(</button>
    <button onclick="append(')')">)</button>
    <button onclick="append('%')" class="operator">%</button>
    <button onclick="backspace()">⌫</button>

    <button onclick="append('Math.sin(')">sin</button>
    <button onclick="append('Math.cos(')">cos</button>
    <button onclick="append('Math.tan(')">tan</button>
    <button onclick="append('Math.log10(')">log</button>
    <button onclick="append('Math.sqrt(')">√</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('/')" class="operator">÷</button>
    <button onclick="append('**')" class="operator">^</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('*')" class="operator">×</button>
    <button onclick="append('Math.PI')">π</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('-')" class="operator">−</button>
    <button onclick="append('Math.E')">e</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button onclick="append('+')" class="operator">+</button>
    <button onclick="calculate()" class="equal">=</button>
  </div>
</div>

<script>
let display = document.getElementById("display");

function append(value) {
  if(display.innerText === "0") display.innerText = "";
  display.innerText += value;
}

function clearDisplay() {
  display.innerText = "0";
}

function backspace() {
  display.innerText = display.innerText.slice(0, -1);
  if(display.innerText === "") display.innerText = "0";
}

function calculate() {
  try {
    let result = eval(display.innerText);
    display.innerText = result;
  } catch {
    display.innerText = "Error";
  }
}

// Keyboard support
document.addEventListener("keydown", (e) => {
  if(!isNaN(e.key) || "+-*/().".includes(e.key)) {
    append(e.key);
  } else if(e.key === "Enter") {
    calculate();
  } else if(e.key === "Backspace") {
    backspace();
  }
});
</script>

</body>
</html>
