<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Skills</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 40px;
      text-align: center;
    }

    .skills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1200px;
      width: 100%;
    }

    .skill-card {
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 24px;
      flex: 1 1 300px;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .skill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .skill-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: #e0e0e0;
    }

    .skill-percent {
      font-size: 0.95rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d2ff 0%, #928dab 100%);
      border-radius: 4px;
      transition: width 0.4s ease-in-out;
    }
  </style>
</head>
<body>

  <h1 class="title">My Skills</h1>

  <div class="skills-container">
    
    <!-- Skill Card 1 -->
    <div class="skill-card">
      <div class="skill-header">
        <span class="skill-title">HTML / CSS / JavaScript</span>
        <span class="skill-percent">90%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: 90%;"></div>
      </div>
    </div>

    <!-- Skill Card 2 -->
    <div class="skill-card">
      <div class="skill-header">
        <span class="skill-title">C++ / C# / Java</span>
        <span class="skill-percent">80%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: 80%;"></div>
      </div>
    </div>

    <!-- Skill Card 3 -->
    <div class="skill-card">
      <div class="skill-header">
        <span class="skill-title">UI/UX Design (Figma)</span>
        <span class="skill-percent">85%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: 85%;"></div>
      </div>
    </div>

  </div>

</body>
</html>
