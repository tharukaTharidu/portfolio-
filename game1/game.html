<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Tracking Basket Game</title>
<style>
  body {margin:0; overflow:hidden; background:#111; color:white; font-family:sans-serif;}
  canvas {display:block; margin:0 auto; background:#222;}
  #score {position:absolute; top:10px; left:10px; font-size:24px; color:#facc15;}
</style>
</head>
<body>
<div id="score">Score: 0</div>
<video id="video" style="display:none;"></video>
<canvas id="canvas" width="640" height="480"></canvas>

<!-- MediaPipe Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreDiv = document.getElementById('score');

let basketX = canvas.width/2 - 50;
let basketY = canvas.height - 60;
let basketWidth = 100;
let basketHeight = 50;
let score = 0;

let objects = [];
function spawnObject(){
  objects.push({
    x: Math.random()*(canvas.width-30),
    y: -30,
    size: 30,
    speed: 2 + Math.random()*3
  });
}
setInterval(spawnObject, 1000);

// MediaPipe Hands
const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.7, minTrackingConfidence:0.7});

hands.onResults(results=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Draw falling objects
  for(let i=0; i<objects.length; i++){
    let obj = objects[i];
    obj.y += obj.speed;
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(obj.x, obj.y, obj.size/2,0,Math.PI*2);
    ctx.fill();

    // Check collision
    if(obj.y + obj.size/2 >= basketY && obj.x >= basketX && obj.x <= basketX + basketWidth){
      score += 1;
      objects.splice(i,1);
      i--;
      scoreDiv.innerText = "Score: " + score;
    } else if(obj.y > canvas.height){
      objects.splice(i,1);
      i--;
    }
  }

  // Draw basket
  ctx.fillStyle = '#00ff00';
  ctx.fillRect(basketX, basketY, basketWidth, basketHeight);

  // Move basket with hand
  if(results.multiHandLandmarks && results.multiHandLandmarks[0]){
    const hand = results.multiHandLandmarks[0];
    const x = hand[9].x * canvas.width; // middle finger base as reference
    basketX = x - basketWidth/2;
    if(basketX < 0) basketX = 0;
    if(basketX + basketWidth > canvas.width) basketX = canvas.width - basketWidth;
  }

  // Draw hand landmarks (optional)
  if(results.multiHandLandmarks){
    for(const landmarks of results.multiHandLandmarks){
      drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color:'#00FFFF', lineWidth:2});
      drawLandmarks(ctx, landmarks, {color:'#FF0000', lineWidth:1});
    }
  }
});

// Start webcam
navigator.mediaDevices.getUserMedia({video:true}).then(stream=>{
  video.srcObject = stream;
  video.play();
  const camera = new Camera(video, {
    onFrame: async ()=>{ await hands.send({image: video}); },
    width:640, height:480
  });
  camera.start();
});
</script>
</body>
</html>
